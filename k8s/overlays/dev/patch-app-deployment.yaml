apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ledger
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: ledger-api
          image: ledger:local
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
