apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledger
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - postgres
            - -c
            - synchronous_commit=off
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=512MB
            - -c
            - max_wal_size=1GB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=64MB
            - -c
            - max_connections=300
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
