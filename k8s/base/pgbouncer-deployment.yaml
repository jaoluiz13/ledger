apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: POSTGRES_DB
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: AUTH_TYPE
              value: plain
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "5000"
            - name: DEFAULT_POOL_SIZE
              value: "80"
            - name: MIN_POOL_SIZE
              value: "20"
            - name: RESERVE_POOL_SIZE
              value: "20"
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
            - name: SERVER_RESET_QUERY
              value: ""
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
