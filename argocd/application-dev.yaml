apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ledger-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ledger.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
