services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ledger-pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: ledger
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ledger
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 20
      SERVER_RESET_QUERY:
      AUTH_TYPE: plain
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ledger-app
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://postgres:ledger@postgres:5432/ledger}
      DB_POOL_MAX: 80
      DB_CONNECT_TIMEOUT: 20
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ledger_pgdata:
